[extend]
useDefault = true

[[rules]]
id = "hashicorp-vault"
description = "HashiCorp Vault token (hvs., hvb., hvr.)"
regex = '''\bhv[sbr]\.[A-Za-z0-9._-]{24,}'''
keywords = ["hvs.", "hvb.", "hvr."]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\bsk-ant-(api|admin)\d{2}-[A-Za-z0-9_\-]{60,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "czech-iban"
description = "Czech IBAN"
regex = '''\bCZ\d{2} ?(?:\d{4} ?){4}\d{4}\b'''
keywords = ["cz"]

[[rules]]
id = "czech-vat-dic"
description = "Czech VAT number (DIČ)"
regex = '''\bCZ\d{8,10}\b'''
keywords = ["cz"]

[[rules]]
id = "czech-ico"
description = "Czech business ID (IČO) after its label"
regex = '''(?i)\bi[čc]o\s*[:=]\s*\d{8}\b'''
keywords = ["ico", "ičo"]

[[rules]]
id = "czech-birth-number"
description = "Czech birth number (rodné číslo)"
regex = '''\b\d{6}/\d{3,4}\b'''
