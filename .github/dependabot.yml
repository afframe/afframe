# Keeps SHA-pinned actions, the Railway SDK and service base images current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/apps/*"]
    schedule:
      interval: weekly
