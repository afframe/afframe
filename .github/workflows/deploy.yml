name: Deploy

# Every push to main: build the changed services to GHCR and deploy them to afframe-vps
# (docs/vps.md). Target: about a minute from merge to live, no long checks in the way.
# No GitHub secrets: the runner joins the tailnet with Tailscale workload identity (OIDC), reaches
# the host over Tailscale SSH, and the host reads runtime secrets from Vault.
# The deploy job runs only once the repository variable AFFRAME_VPS_ENABLED is `true`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      services: ${{ steps.changes.outputs.services }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No-deploy gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            mapfile -t commits < <(jq -r '.commits[].id' "$GITHUB_EVENT_PATH")
            bash scripts/ci/deploy-gate.sh "${commits[@]}" >> "$GITHUB_OUTPUT"
          fi
      - name: Changed services
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/deploy-services.sh "$BEFORE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.deploy == 'true' && needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [plan, build]
    if: >-
      !cancelled() && needs.build.result != 'failure' && vars.AFFRAME_VPS_ENABLED == 'true'
      && needs.plan.outputs.deploy == 'true'
      && (needs.plan.outputs.services != '[]' || needs.plan.outputs.infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://afframe.com
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve image digests
        id: images
        env:
          SERVICES: ${{ needs.plan.outputs.services }}
          REPOSITORY: ${{ github.repository }}
        run: |
          specs=()
          for service in $(jq -r '.[]' <<< "$SERVICES"); do
            image="ghcr.io/$REPOSITORY/$service"
            digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
            specs+=("$service=$image@$digest")
          done
          echo "specs=${specs[*]}" | tee -a "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-afframe
      - name: Deploy over Tailscale SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SPECS: ${{ steps.images.outputs.specs }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          # The images are private: the host pulls them with this run's own token (packages: read),
          # passed on stdin and valid only while the job runs.
          # shellcheck disable=SC2086 # SPECS is a space-separated list of validated service=image pairs
          printf '%s' "$REGISTRY_TOKEN" | sudo tailscale ssh "deploy@$DEPLOY_HOST" /srv/afframe/repo/deploy/bin/afframe-deploy deploy "$GITHUB_SHA" $SPECS
