name: Feature
description: Record a feature idea. Only the idea is required.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs it and why.
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
  - type: textarea
    id: design
    attributes:
      label: Design
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How to prove that it works.
