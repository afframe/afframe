# Traefik static config. Routes come from files only (no Docker socket): afframe-deploy writes one
# file per app service into the dynamic directory and copies deploy/traefik/dynamic/*.yml there.
# Cloudflare proxies every public host (SSL mode Full (strict), Cloudflare Origin CA certificate).
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
    forwardedHeaders:
      trustedIPs: &cloudflare
        # https://www.cloudflare.com/ips/ (checked 2026-10-01)
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  websecure:
    address: ":443"
    http:
      tls: {}
    forwardedHeaders:
      trustedIPs: *cloudflare

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

ping: {}

log:
  level: INFO

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
