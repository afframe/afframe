# A port that is not the image default, so the test proves that the service reads $PORT.
x-port: &port
  PORT: "9090"

services:
  placeholder:
    build: &placeholder
      context: .
      dockerfile: apps/placeholder/Dockerfile
    environment: *port
    # Docker may disable IPv6 in containers: turn it on so the [::1] check below is real.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  test:
    build: *placeholder
    network_mode: service:placeholder
    depends_on: [placeholder]
    environment: *port
    entrypoint: ["sh", "-c"]
    command:
      - |
        for url in "http://127.0.0.1:$$PORT/health" "http://[::1]:$$PORT/health"; do
          for _ in $$(seq 30); do wget -q -O /dev/null "$$url" && break; sleep 0.2; done
          wget -q -O /dev/null "$$url" || { echo "GET $$url failed" >&2; exit 1; }
          echo "ok $$url"
        done
